[project]
name = "orca-api"
version = "0.1.0"
description = "Orca Research 后端:Deep Search 研究助手(FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
